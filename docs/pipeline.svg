<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 368" role="img" aria-labelledby="t d">
  <title id="t">What verify does, and what each step catches</title>
  <desc id="d">Five steps run in order: pack the plugin the way npm would, install the tarball, import the root export the loader imports, mount the panel, and activate it on a context whose services have not mounted yet. Each step catches a failure that would otherwise only appear in someone's profile.</desc>
  <style>
    .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
    .box-a{fill:#f4f7ff;stroke:#9db4e8}
    .t{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#1d2129}
    .s{font:400 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#5b6472}
    .m{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7a8494}
    .fail{font:400 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#8a4b4b}
    .a{stroke:#8d99ab;stroke-width:1.5;fill:none;marker-end:url(#ah)}
    .label{font:400 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#6b7480}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8d99ab"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="368" fill="#fbfcfd"/>

  <text class="label" x="24" y="40">your plugin folder</text>

  <!-- five steps -->
  <rect class="box box-a" x="24" y="62" width="172" height="74" rx="10"/>
  <text class="t" x="40" y="86">1. pack</text>
  <text class="s" x="40" y="104">the way npm will</text>
  <text class="m" x="40" y="122">npm pack --json</text>

  <rect class="box" x="220" y="62" width="172" height="74" rx="10"/>
  <text class="t" x="236" y="86">2. install</text>
  <text class="s" x="236" y="104">the tarball, not the</text>
  <text class="s" x="236" y="120">working copy</text>

  <rect class="box" x="416" y="62" width="172" height="74" rx="10"/>
  <text class="t" x="432" y="86">3. import</text>
  <text class="s" x="432" y="104">the root export the</text>
  <text class="s" x="432" y="120">loader mounts</text>

  <rect class="box" x="612" y="62" width="172" height="74" rx="10"/>
  <text class="t" x="628" y="86">4. mount</text>
  <text class="s" x="628" y="104">the client bundle,</text>
  <text class="s" x="628" y="120">in jsdom</text>

  <rect class="box" x="808" y="62" width="168" height="74" rx="10"/>
  <text class="t" x="824" y="86">5. activate</text>
  <text class="s" x="824" y="104">on a context with</text>
  <text class="s" x="824" y="120">no services yet</text>

  <path class="a" d="M196 99 L216 99"/>
  <path class="a" d="M392 99 L412 99"/>
  <path class="a" d="M588 99 L608 99"/>
  <path class="a" d="M784 99 L804 99"/>

  <!-- what each catches -->
  <text class="label" x="24" y="166">what each step catches, that doctor cannot</text>

  <text class="fail" x="24" y="192">files forgot client.js</text>
  <text class="m" x="24" y="208">the tarball is missing it</text>

  <text class="fail" x="220" y="192">root export is the CLI</text>
  <text class="m" x="220" y="208">nothing to apply</text>

  <text class="fail" x="416" y="192">the module throws</text>
  <text class="m" x="416" y="208">on import</text>

  <text class="fail" x="612" y="192">no __ModuleLoader__ call</text>
  <text class="m" x="612" y="208">not a client bundle</text>

  <text class="fail" x="808" y="192">reads an undeclared</text>
  <text class="m" x="808" y="208">service: cordis throws</text>

  <line x1="24" y1="232" x2="976" y2="232" stroke="#e3e6ea" stroke-width="1"/>

  <text class="label" x="24" y="262">and the two failures that only a running host shows</text>

  <rect class="box" x="24" y="276" width="300" height="72" rx="10"/>
  <text class="t" x="40" y="300">one unguarded apply()</text>
  <text class="s" x="40" y="318">fails the whole web boot, so the app</text>
  <text class="s" x="40" y="334">disables every third-party plugin</text>

  <rect class="box" x="348" y="276" width="300" height="72" rx="10"/>
  <text class="t" x="364" y="300">a tab type with no guide</text>
  <text class="s" x="364" y="318">registers successfully and no UI can</text>
  <text class="s" x="364" y="334">ever open it: a testkit assertion</text>

  <text class="label" x="672" y="300">Both are covered: the first by step 5,</text>
  <text class="label" x="672" y="318">the second by mounting with a host that</text>
  <text class="label" x="672" y="334">records the registration.</text>
</svg>
