name: dsh-plugin preflight
description: Check that a DeepSeek Harness plugin can actually be installed before you tag it.
author: WJDdidi-1
branding:
  icon: package
  color: blue
inputs:
  dir:
    description: Folder that holds the plugin's package.json
    required: false
    default: .
  command:
    description: verify (pack, install, mount) or doctor (manifest checks only) or index (audit market/index.json)
    required: false
    default: verify
  version:
    description: Version of dsh-plugin-toolkit to run
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Run dsh-plugin
      shell: bash
      # The package is fetched instead of shipped with the action: `verify`
      # mounts the panel, which needs jsdom and React, and pinning those inside
      # a composite action would mean shipping node_modules in the repository.
      run: npx --yes dsh-plugin-toolkit@${{ inputs.version }} ${{ inputs.command }} "${{ inputs.dir }}"
