name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is arm64, and GitHub's arm64 pool can leave a job
        # unacquired for 15 minutes and then fail the whole run. Name the
        # Intel image explicitly so the macOS leg keeps running, not skipped.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  dogfood:
    name: the tool on a real plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/dsh-plugin.mjs doctor fixtures/good
      - name: a broken plugin must fail
        run: |
          if node bin/dsh-plugin.mjs doctor fixtures/no-engines; then
            echo "doctor accepted a plugin with no host range"; exit 1
          fi
      - run: node bin/dsh-plugin.mjs release fixtures/good --dry-run
